name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Simple Admin Account & Disable Password Policy
        run: |
          # 1. 强行关闭系统的密码复杂性要求，允许使用 123 这种简单密码
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" | Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg

          # 2. 创建账号 a123，密码 123
          $Password = ConvertTo-SecureString "123" -AsPlainText -Force
          New-LocalUser -Name "a123" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "a123" -ErrorAction SilentlyContinue
          
          # 3. 顺便把默认的 runneradmin 密码也改成 123
          net user runneradmin 123

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # 下载安装 Tailscale
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # 连接 Tailscale 网络（加入了 --ephemeral 临时节点和固定主机名）
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --ephemeral

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Connect to   : github-rdp-server" -ForegroundColor Yellow
          Write-Host "  Username     : a123" -ForegroundColor Yellow
          Write-Host "  Password     : 123" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (approx 5h40m)
        run: |
          # 跑约5小时40分钟（340分钟），避免被 GitHub 6小时强制斩杀导致清理失败
          for ($i = 1; $i -le 340; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/340] Server running..."
          }

      - name: 5. Cleanup: Logout from Tailscale
        if: always()   # 无论前面是否报错，最后都执行，瞬间释放 IP 和主机名
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" logout
