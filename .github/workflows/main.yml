name: 获取所有来源的 keybox.xml

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 0 点运行

jobs:
  fetch-all-keyboxes:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 如需自动提交，请保留（默认关闭）
    steps:
      - name: 检出仓库（可选，用于后续提交）
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y curl wget xxd git

      - name: 克隆 keybox-tools
        run: |
          git clone https://github.com/purainity/keybox-tools.git
          cd keybox-tools
          chmod +x *.sh check.py

      - name: 安装 Python 依赖
        run: |
          pip install requests cryptography

      - name: 获取所有 keybox 并检查有效性（循环三个来源）
        run: |
          cd keybox-tools
          mkdir -p ../output                    # 创建输出目录
          summary="../output/summary.txt"
          echo "=========================================" > "$summary"
          echo "  所有来源 Keybox 汇总报告（按顺序）" >> "$summary"
          echo "=========================================" >> "$summary"
          echo "" >> "$summary"

          # 定义来源列表（顺序即为序号）
          sources=("yuri" "MeowDump" "TrickyAddon")
          i=1

          for src in "${sources[@]}"; do
            echo ">>> 正在处理来源 $i: ${src}.sh ..."
            
            # 1. 执行获取脚本（生成 keybox.xml）
            bash ${src}.sh ./keybox.xml

            # 2. 将 keybox.xml 重命名为带序号和来源名的文件，移到 output/
            mv ./keybox.xml "../output/keybox_${i}_${src}.xml"

            # 3. 对该文件执行检查，将完整输出保存到单独的检查日志
            python3 check.py "../output/keybox_${i}_${src}.xml" > "../output/check_${i}_${src}.txt" 2>&1

            # 4. 提取检查结果中的关键一行（通常包含 ✅ 或 ❌）
            result=$(grep -E "✅|❌" "../output/check_${i}_${src}.txt" | head -1)
            if [ -z "$result" ]; then
              result="⚠️ 无法解析检查结果（请查看 check_${i}_${src}.txt）"
            fi

            # 5. 写入汇总报告
            echo "$i. 文件名: keybox_${i}_${src}.xml" >> "$summary"
            echo "   来源: ${src}.sh" >> "$summary"
            echo "   检查结果: $result" >> "$summary"
            echo "" >> "$summary"

            echo "   ✅ 完成，结果: $result"
            ((i++))
          done

          echo "=========================================" >> "$summary"
          echo "  全部处理完毕。所有文件已保存至 output/ 目录" >> "$summary"

          # 回到工作区根目录，以便上传 artifact
          cd ..

      - name: 上传所有 keybox 文件 + 检查日志 + 汇总报告
        uses: actions/upload-artifact@v4
        with:
          name: all-keyboxes
          path: output/
          retention-days: 30

      # ---- 以下为可选：自动提交到仓库（默认关闭，需谨慎启用） ----
      - name: 提交所有文件到仓库（可选）
        if: false   # 改为 true 以启用（仅限私有仓库）
        run: |
          cp -r output/* ./
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ keybox_*.xml check_*.txt summary.txt 2>/dev/null || true
          git commit -m "更新所有来源的 keybox [skip ci]" || echo "没有变化"
          git push
