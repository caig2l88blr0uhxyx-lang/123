name: 获取所有来源的 keybox.xml

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  fetch-all-keyboxes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y curl wget xxd git

      - name: 克隆 keybox-tools
        run: |
          git clone https://github.com/purainity/keybox-tools.git
          cd keybox-tools
          chmod +x *.sh check.py

      - name: 安装 Python 依赖
        run: |
          pip install requests cryptography

      - name: 获取所有 keybox 并检查有效性（强化错误处理）
        run: |
          cd keybox-tools
          mkdir -p ../output
          summary="../output/summary.txt"
          echo "=========================================" > "$summary"
          echo "  所有来源 Keybox 汇总报告（按顺序）" >> "$summary"
          echo "=========================================" >> "$summary"
          echo "" >> "$summary"

          sources=("yuri" "MeowDump" "TrickyAddon")
          i=1

          # 关闭错误退出，确保单个失败不影响后续
          set +e

          for src in "${sources[@]}"; do
            echo ""
            echo ">>> 正在处理来源 $i: ${src}.sh ..."

            # 1) 执行获取脚本，捕获返回码
            bash ${src}.sh ./keybox.xml
            ret=$?

            # 2) 判断是否成功
            if [ $ret -eq 0 ] && [ -f ./keybox.xml ] && [ -s ./keybox.xml ]; then
              status="成功获取"
              # 移动文件
              mv ./keybox.xml "../output/keybox_${i}_${src}.xml"
              # 检查有效性（即使 check.py 返回非零，也保留输出）
              python3 check.py "../output/keybox_${i}_${src}.xml" > "../output/check_${i}_${src}.txt" 2>&1
              check_ret=$?
              # 提取结果摘要
              result=$(grep -E "✅|❌" "../output/check_${i}_${src}.txt" | head -1)
              if [ -z "$result" ]; then
                result="⚠️ 无法解析检查结果（请查看 check_${i}_${src}.txt）"
              fi
            else
              # 获取失败或文件不存在/为空
              if [ -f ./keybox.xml ]; then
                # 可能部分保存，我们仍保留它，但注明异常
                mv ./keybox.xml "../output/keybox_${i}_${src}_partial.xml"
                echo "⚠️ ${src}.sh 返回码 $ret，但生成了 keybox（可能不完整），已保存为 keybox_${i}_${src}_partial.xml" >> "$summary"
                result="❌ 获取失败（返回码 $ret），文件可能不完整"
              else
                echo "❌ ${src}.sh 执行失败（返回码 $ret），未生成任何文件" >> "$summary"
                result="❌ 获取失败（返回码 $ret），无文件"
                # 创建一个占位文件说明失败
                echo "来源 ${src}.sh 执行失败，返回码 $ret" > "../output/error_${i}_${src}.txt"
              fi
            fi

            # 写入汇总（无论成功失败都记录）
            echo "$i. 来源: ${src}.sh" >> "$summary"
            if [ -f "../output/keybox_${i}_${src}.xml" ] || [ -f "../output/keybox_${i}_${src}_partial.xml" ]; then
              if [ -f "../output/keybox_${i}_${src}.xml" ]; then
                fname="keybox_${i}_${src}.xml"
              else
                fname="keybox_${i}_${src}_partial.xml"
              fi
              echo "   文件名: $fname" >> "$summary"
            else
              echo "   文件名: 未生成（详见 error_${i}_${src}.txt）" >> "$summary"
            fi
            echo "   状态: $result" >> "$summary"
            echo "" >> "$summary"

            ((i++))
          done

          # 恢复错误退出
          set -e

          echo "=========================================" >> "$summary"
          echo "  全部处理完毕。" >> "$summary"
          cd ..

      - name: 上传所有文件（含检查日志和汇总）
        uses: actions/upload-artifact@v4
        with:
          name: all-keyboxes
          path: output/
          retention-days: 30

      # 可选：推送到仓库（默认关闭）
      - name: 提交所有文件到仓库（可选）
        if: false
        run: |
          cp -r output/* ./
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ keybox_*.xml check_*.txt summary.txt error_*.txt 2>/dev/null || true
          git commit -m "更新所有来源的 keybox [skip ci]" || echo "没有变化"
          git push
